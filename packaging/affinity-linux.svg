<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- A pen nib for creative work, with an install badge. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6ef7"/>
      <stop offset="1" stop-color="#7a3ff2"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6ff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>

  <!-- nib, tilted like a pen in use -->
  <g transform="translate(-5 -4) rotate(-38 118 124) scale(1.08) translate(-9 -9)">
    <rect x="90" y="40" width="56" height="18" rx="6" fill="#fff" opacity="0.85"/>
    <path d="M86 66h64v30c0 28-14 54-32 86c-18-32-32-58-32-86z" fill="url(#nib)"/>
    <path d="M118 118v62" stroke="#5a55f4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="118" cy="112" r="9" fill="#5a55f4"/>
  </g>

  <!-- install badge -->
  <circle cx="186" cy="186" r="36" fill="#fff"/>
  <g fill="none" stroke="#6a4af4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M186 166v30"/>
    <path d="M173 184l13 13 13-13"/>
    <path d="M170 206h32"/>
  </g>
</svg>
